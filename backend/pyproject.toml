[project]
name = "melssy-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14", "asyncpg>=0.30", "fastapi>=0.115", "httpx>=0.28", "psycopg2-binary>=2.9",
  "pydantic>=2.10", "pydantic-settings>=2.7", "sqlalchemy[asyncio]>=2.0",
  "structlog>=24.4", "uvicorn[standard]>=0.34"
]

[project.optional-dependencies]
dev = ["aiosqlite>=0.20", "pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
