services:
  database:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
        POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
        POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U melssy -d melssybeauty"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - melssy-postgres:/var/lib/postgresql/data

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set}
    depends_on:
      database:
        condition: service_healthy

volumes:
  melssy-postgres:
